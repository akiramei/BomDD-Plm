bomdd:
  product: BomDD-Plm
  experiment: plm-v0
  layer: M-BOM

# 受入3条件: 完全性(test_vectors)・無矛盾性・Control Plan 列。FMEA は 33 に前倒し済み。
# 粒度: 独立に再製造・交換でき単独で自己受入できる単位(fresh factory に単体で渡せるか)。

mbom:
  procurement:                 # 列挙外パッケージの採用= ずる報告対象(40-work-order)
    runtime:
      - { package: yaml, version: "2.8.0", pin: exact, rationale: 位置情報(line/col)取得・重複キー検出・YAML1.2 core schema, alternative: js-yaml(位置情報が弱く不採用), license: ISC }
    dev:
      - { package: typescript, version: "5.8.x", pin: minor, rationale: ビルド= tsc 単独, license: Apache-2.0 }
      - { package: "@types/node", version: "22.x", pin: major, rationale: Node22 型定義, license: MIT }
    policy:
      - テスト= node:test / 引数= node:util parseArgs / グラフ描画= 自前 SVG(K-VIEWER-VANILLA) — いずれも調達ゼロ(UQ-SPEC-003 は「自前 SVG」で解決)
      - viewer の実行時依存= ゼロ(自己完結 INV-008)

  manufacturing_units:
    - id: M-CORE-INGEST-001
      name: 発見+頑健パース
      ebom_refs: [E-CORE-READONLY-001, E-CORE-DISCOVER-002, E-CORE-PARSE-003]
      kbom_refs: [K-REFV0, K-TS-DETERMINISM, K-YAML-AUTHORING, K-NODE-PORTABILITY]
      artifact: { path: packages/core/src, type: ts-module }
      interface_contract:
        discover: "discover(ws: Workspace, schema: RefSchema): Artifact[]  // Artifact={repo, canonicalPath, type}。ソート済み"
        parse: "parseArtifact(a: Artifact): {doc?: unknown, findings: Finding[]}  // クラッシュしない。X-PARSE/X-TYPE"
      invariants: [INV-001, INV-002, "重複キー= X-TYPE-001+後勝ち"]
      acceptance_refs: [CP-READONLY-001, CP-DISCOVER-002, CP-PARSE-003]
      fmea_refs: [FMEA-002, FMEA-009]
    - id: M-CORE-GRAPH-002
      name: スキーマ読込+索引+参照解決+workspace
      ebom_refs: [E-CORE-SCHEMA-004, E-CORE-RESOLVE-005, E-CORE-WORKSPACE-006]
      rev_note: "ECO-002: repo: 形の repo 不在= X-XREPO skip(§2.4 rev3)+schema/load が diff_audit を読む"
      kbom_refs: [K-REFV0, K-TS-DETERMINISM, K-NODE-PORTABILITY]
      artifact: { path: packages/core/src, type: ts-module }
      interface_contract:
        loadSchema: "loadSchema(dir: string): RefSchema | ExitError(2)  // 未対応記法= X-SCHEMA 所見"
        buildModel: "buildModel(docs, schema, ws): {index, edges, findings}  // family 判定・id-or-path・X-ID/X-XREPO"
      invariants: [INV-004, INV-007]
      acceptance_refs: [CP-SCHEMA-004, CP-RESOLVE-005, CP-WORKSPACE-006]
      fmea_refs: [FMEA-003, FMEA-005, FMEA-010]
    - id: M-CORE-RULES-003
      name: リント規則+ゲート+抑制
      ebom_refs: [E-CORE-LINT-007, E-CORE-GATE-008, E-CORE-SUPPRESS-009, E-CORE-GITDIFF-030]
      rev_note: "ECO-002: R-052 eco-diff-within-impact(§2.17)+E-CORE-GITDIFF-030(git 読み取りアダプタ)を編入"
      kbom_refs: [K-REFV0]
      artifact: { path: packages/core/src, type: ts-module }
      interface_contract:
        evaluate: "evaluate(model, schema): Finding[]  // R-* 全評価+gate 付与"
        applyGate: "appliedRules(gate, eco): Set<RuleId>  // §2.7 の式"
        applySuppress: "applySuppress(findings, cfg): {findings, findings X-SUPPRESS}  // info 降格・reason 転記"
      acceptance_refs: [CP-LINT-007, CP-GATE-008, CP-SUPPRESS-009]
      fmea_refs: [FMEA-003, FMEA-004, FMEA-006]
    - id: M-CORE-OUTPUT-004
      name: 正規シリアライザ+出力契約スキーマ
      ebom_refs: [E-CORE-OUTPUT-010, E-CONTRACT-DIAG-018, E-CLI-SARIF-031]
      rev_note: "ECO-002: SARIF 2.1.0 ビルダ(--sarif opt-in・§2.9 rev3)を編入"
      kbom_refs: [K-TS-DETERMINISM]
      artifact: { path: packages/core/src, type: ts-module+json-schema }
      interface_contract:
        serialize: "serializeDiagnostics(model): string / serializeGraph(model): string / serializeLedger(model): string  // §2.9 正規形(3出力)"
      invariants: [INV-003, INV-009]
      acceptance_refs: [CP-OUTPUT-010]
      fmea_refs: [FMEA-001]
    - id: M-CLI-005
      name: CLI
      ebom_refs: [E-CLI-011]
      rev_note: "ECO-002: --sarif フラグ追加(§2.10 rev3。他フラグの挙動不変)"
      kbom_refs: [K-NODE-CLI, K-NODE-PORTABILITY]
      artifact: { path: packages/cli/, type: ts-cli(bin=bomdd-lint) }
      interface_contract:
        main: "main(argv): exitCode 0|1|2  // §2.10 マトリクス。stdout=データ/stderr=ログ"
      invariants: [INV-006]
      acceptance_refs: [CP-CLI-011]
    - id: M-VIEWER-GEN-006
      name: viewer 静的生成+シェル
      ebom_refs: [E-VIEWER-SHELL-001]
      kbom_refs: [K-VIEWER-VANILLA, K-DESIGN-PLM]
      artifact: { path: packages/viewer/src, type: ts-module }
      interface_contract:
        generate: "generateView(diagJson: string, graphJson: string, ledgerJson: string): string  // 自己完結 HTML。純粋関数(I/O なし)"
      invariants: [INV-008, "LIV-0001"]
      acceptance_refs: [CP-VIEWER-012]
    - id: M-VIEWER-UI-007
      name: viewer 4ビュー UI(design parts 込み)
      ebom_refs: [E-VIEWER-FINDINGS-002, E-VIEWER-GRAPH-003, E-VIEWER-TRACE-004, E-VIEWER-LEDGER-005,
                  E-DESIGN-SEVCHIP-021, E-DESIGN-FAMCHIP-022, E-DESIGN-SUMCARD-023, E-DESIGN-FINDROW-024,
                  E-DESIGN-NODE-025, E-DESIGN-CALLOUT-026, E-DESIGN-TRACECELL-027, E-DESIGN-LEDGERTBL-028, E-DESIGN-EMPTY-029]
      kbom_refs: [K-VIEWER-VANILLA, K-DESIGN-PLM]
      artifact: { path: packages/viewer/src, type: 埋込 JS/CSS(生成 HTML に内包) }
      display_contract:
        refs: [DC-FINDINGS-001, DC-GRAPH-001, DC-TRACE-001, DC-LEDGER-001]
        required_elements: [DE-F01, DE-F02, DE-F03, DE-F04, DE-F05, DE-F06, DE-G01, DE-G02, DE-G03, DE-G04, DE-G05, DE-G06, DE-T01, DE-T02, DE-T03, DE-T04, DE-L01, DE-L02, DE-L03, DE-L04, DE-L05]
      invariants: [INV-010, "LIV-0002/0003/0004", "SVG レイアウト決定的(乱数禁止)"]
      acceptance_refs: [CP-VIEW-FINDINGS-013, CP-VIEW-GRAPH-014, CP-VIEW-TRACE-015, CP-VIEW-LEDGER-016, CP-DESIGN-SYSTEM-019]
      fmea_refs: [FMEA-007, FMEA-008]
    - id: M-HARNESS-008
      name: 自己受入ハーネス(治具 — 製品と同格管理)
      ebom_refs: []
      kbom_refs: [K-TS-DETERMINISM]
      artifact: { path: test/, type: node:test スイート }
      interface_contract:
        run: "node --test  // CP の unit/L2 行 test_vectors 全被覆+L1 スモーク(下記)"
      acceptance_refs: []
      notes: "L1 スモーク= 同梱ミニ fixture に対し CLI 実行→ exit code/出力ファイル存在/plm-view.html 生成を1本通す(unit 緑のまま表面全滅の盲点対策・forward-01)。治具セルフテスト(比較器の合成データ検証)を含む"

    # ---- ECO-006(2026-08-02): 写像被覆ギャップの解消 — 治具・生成物・CI・スキーマの所有宣言 ----
    #      rev2(2026-08-02・差戻 1 回目 IA-ECO006-01〜04 の是正。詳細= 61 §1・§7)
    # 由来: 上記 8 unit は「著述されるソース」だけを所有していたため、実 diff の 76 件(ECO-001〜005)が
    #   どの unit にも帰属できなかった(遡及採点の unmapped= fail-closed の under)。
    #
    # 【裁定 1(rev2)】unit は **provenance(誰が作るか)** で切る。混載しない。
    #   著述 = BOM から人が/工場が書く(src・test・oracle 治具・package.json・tsconfig.json・CI 定義)
    #   鋳造 = 道具が決定的に生成する(dist/・tsconfig.tsbuildinfo)。人手編集禁止・版管理は再生成可能性で担保
    #   供与 = 外部から版指定で持ち込む(schemas/ref-v0/ = K-REFV0 のスナップショット)
    #   生成物の帰属先は「その生成物を一意に生む製造手順を持つ最小の unit」:
    #     1 package = 1 unit → 当該ソース unit が所有(M-CLI-005 が packages/cli/ を持つ既存宣言)
    #     1 package = N unit → 共同出力ゆえ単一ソース unit に帰属できない → 鋳造専用 unit + depends_on
    #   rev1 からの是正(IA-01): 鋳造 unit の path を packages/<pkg>/dist/ に**限定**した。
    #     rev1 は packages/<pkg>/ 全体を取り、著述物(package.json・tsconfig.json)まで吸収して
    #     「人手編集禁止」の契約と矛盾していた。著述側は M-PKGDEF-* として分離した。
    #
    # 【裁定 3(rev2 新設)】depends_on の意味論 = 「この unit を**再製造する前に成立していなければ
    #   ならない** unit」(製造順序の前提)。実行時依存ではない(実行時の調達は procurement/K-BOM)。
    #   由来(鋳造元)はこの意味論の部分集合として表現される — dist は src が成立していないと鋳造できない。
    #   ※ ref-v0 は depends_on を「family M の参照エッジ」としか規定しておらず意味論は未規定。
    #      本製品の用法として上記を宣言する(スキーマ側への昇格は設計者裁定 — 51 CHEAT-ECO-006-F001/F005)。
    #
    # 様式: M-HARNESS-008(治具= 製品と同格)の前例に整合 — E-BOM 品目を実現しない unit は
    #   ebom_refs: [] / acceptance_refs: [] を許し、再製造手順を notes に書く。
    - id: M-ORACLE-009
      name: 固定オラクル治具(設計者保持 — 工場非開示の受入判定器)
      ebom_refs: []
      kbom_refs: [K-TS-DETERMINISM]
      depends_on: [M-CLI-005]
      artifact: { path: oracle/, type: fixtures+expected+node 治具(.mjs) }
      interface_contract:
        run: "node harness/run-oracle.mjs --cli \"<CLI 起動コマンド>\"  // 41-fixed-oracle の全採点行を実行し PASS/FAIL を返す"
      acceptance_refs: []
      notes: >-
        provenance= 著述(設計者側)。再製造= 41-fixed-oracle.yaml の凍結ケース定義から
        fixtures/expected/harness を組む。自己受入= harness/selftest.mjs(比較器を合成データで検証)。
        M-HARNESS-008(test/)と分けるのは **製造帰属が違う** から(rev2 で論拠訂正・IA-04)—
        test/ は**工場が製造して納品する成果物**(40-work-order「製造対象」表に M-HARNESS-008 |
        (治具) | test/ の行があり、34-routing ROUTE-DELIVER の output にも test/ が入る)。
        一方 oracle/ は 34-routing factory_isolation が「41/42・oracle/ 配下は非開示」と宣言する
        **設計者が保持する受入判定器**であり、工場は作りも見もしない。
        両者を同一 unit にすると「工場が自分の採点器を作る」ことになり受入の独立性が壊れる。
        (rev1 の論拠「test/ は工場へ渡る」は 34-routing の供与物リスト— 20/30-35/40+ref-v0+UI-CAD —
        と不一致だった。test/ は供与物ではなく製造物である。)
    - id: M-BUILD-CORE-010
      name: core の鋳造出力(dist/)
      ebom_refs: []
      kbom_refs: [K-TS-DETERMINISM]
      depends_on: [M-CORE-INGEST-001, M-CORE-GRAPH-002, M-CORE-RULES-003, M-CORE-OUTPUT-004, M-PKGDEF-CORE-015]
      artifact: { path: packages/core/dist/, type: 鋳造出力(tsc の .js/.d.ts/.d.ts.map) }
      interface_contract:
        build: "tsc -b packages/core  // 決定的。**人手編集禁止**(著述物でなく鋳造物)"
      acceptance_refs: []
      notes: >-
        provenance= 鋳造のみ(rev2・IA-01 是正: rev1 は packages/core/ 全体を取り著述物を吸収していた)。
        専用 unit にする理由= dist は 4 ソース unit の**共同出力**であり、どの単一ソース unit にも
        「独立に再製造・交換できる単位」として帰属させられないため。
        生成物は自 unit 以外の理由でも変化する(ECO-005: 依存先 d.ts 変更に伴うビルドキャッシュ更新)—
        depends_on が「由来 unit の変化に追従した鋳造」を機械可読に残す。
        ビルド入力の著述物(package.json / tsconfig.json)は M-PKGDEF-CORE-015 が所有し、
        本 unit はそれに depends_on する(鋳造には構成の成立が先立つ)。
    - id: M-BUILD-VIEWER-011
      name: viewer の鋳造出力(dist/)
      ebom_refs: []
      kbom_refs: [K-TS-DETERMINISM]
      depends_on: [M-VIEWER-GEN-006, M-VIEWER-UI-007, M-BUILD-CORE-010, M-PKGDEF-VIEWER-016]
      artifact: { path: packages/viewer/dist/, type: 鋳造出力(tsc の .js/.d.ts/.d.ts.map) }
      interface_contract:
        build: "tsc -b packages/viewer  // 決定的。**人手編集禁止**"
      acceptance_refs: []
      notes: >-
        M-BUILD-CORE-010 と同じ帰属規則・同じ provenance 限定。
        depends_on に **M-BUILD-CORE-010 を含む**(rev2・IA-03 是正)— packages/viewer/tsconfig.json の
        references: [{ path: ../core }] と package.json の dependencies: { "@bomdd/core": "0.0.0" } により、
        viewer の鋳造は core の**鋳造出力(.d.ts)が成立していること**を前提とする。
        rev1 は viewer の 2 ソース unit しか挙げておらず、実ビルドの前提を取りこぼしていた。
        ECO-001〜005 の実 diff には現れていない(是正でなく被覆の完全性のための宣言 — 次に viewer を
        再ビルドする ECO で unmapped を出さない fail-closed 側の措置。61 §4)。
    - id: M-CI-012
      name: CI 定義(両 OS 回帰+ code scanning 連携)
      ebom_refs: []
      kbom_refs: [K-NODE-PORTABILITY]
      depends_on: [M-PKGDEF-CORE-015, M-PKGDEF-VIEWER-016, M-BUILD-CORE-010, M-BUILD-VIEWER-011, M-CLI-005, M-HARNESS-008, M-ORACLE-009]
      artifact: { path: .github/, type: GitHub Actions ワークフロー+変換スクリプト(.mjs) }
      interface_contract:
        ci: "push/PR で build → node --test → 固定オラクル全行 → self-hosting lint(--eco --fail-on error)を ubuntu/windows で実行"
      acceptance_refs: []
      notes: >-
        provenance= 著述。再製造= 34-routing の受入手順(ROUTE-SELF-ACCEPT ほか)を CI 記述へ写す。
        自己受入= ワークフロー実行が両 OS で緑。CI は測定器であり検査の正本ではない
        (正本は 33-control-plan と 41-fixed-oracle)。
        depends_on は ci.yml の steps が実際に成立を要求する unit の全体(rev2・IA-03 是正)—
        build ステップが **鋳造 unit 2 件**を、oracle ステップが M-ORACLE-009 と M-CLI-005 を、
        unit tests が M-HARNESS-008 を、npm ci が **パッケージ定義 2 件**を前提とする。
        rev1 は鋳造 unit とパッケージ定義を落としていた(CI が build を回すのに build 成果物の
        unit を前提に挙げていない= 前提の取りこぼし)。
    - id: M-SCHEMA-013
      name: 参照層スキーマの供与スナップショット(ref-v0)
      ebom_refs: []
      kbom_refs: [K-REFV0]
      depends_on: []   # 供与物 — 本製品内に先立つ製造前提を持たない(版は K-REFV0 が指定)
      artifact: { path: schemas/ref-v0/, type: 供与スナップショット(yaml+json-schema) }
      interface_contract:
        refSchema: "schemas/ref-v0/(ref-edges.draft.yaml / id-grammar.draft.yaml / bomdd-ref.draft.schema.json)  // リンタの既定スキーマ。--schema で差替可"
      acceptance_refs: []   # ECO-006 スコープ外: 33-control-plan への acceptance 接続の新設(order §1)
      notes: >-
        provenance= **供与**(rev2・IA-02 是正: rev1 は供与入力と製造出力を単一 unit に混載していた)。
        再製造= K-REFV0 の版指定で method 側 draft から同期する(製品内で著述しない — 上流が正本)。
        交換= スキーマ版の差替そのもの(S-13 が --schema 差替を固定オラクルで担保)。
        出力契約スキーマ(schemas/plm-*.schema.json)は provenance が違うため M-SCHEMA-CONTRACT-014 へ分離した。
    - id: M-SCHEMA-CONTRACT-014
      name: 出力契約スキーマ(schemas/ 直下)
      ebom_refs: []
      kbom_refs: []
      depends_on: [M-CORE-OUTPUT-004]
      artifact: { path: schemas/, type: json-schema(出力契約 3 種) }
      interface_contract:
        outputContract: "schemas/plm-{diag,graph,ledger}-1.schema.json  // §2.9 正規形の出力契約。M-CORE-OUTPUT-004 の serialize* が満たす"
      acceptance_refs: []   # ECO-006 スコープ外(order §1)。意味的な受入は CP-OUTPUT-010
      notes: >-
        provenance= 著述(製品の公開契約)。意味的には M-CORE-OUTPUT-004 の成果物(同 unit の
        artifact.type が既に ts-module+json-schema)だが、**現行 M-BOM は 1 unit に複数 artifact path を
        宣言できない**ため別 unit とし depends_on で帰属を残す(複数 path 宣言の可否は ref-v0 側の裁定 — 61 §5)。
        所有範囲= schemas/ 直下(ref-v0/ は最長前方一致で M-SCHEMA-013 が所有)。
        schemas/ に新しいサブディレクトリを置く場合は provenance を確かめて unit を立てること
        (本 unit を catch-all にしない運用註)。
    - id: M-PKGDEF-CORE-015
      name: core のパッケージ定義・ビルド構成
      ebom_refs: []
      kbom_refs: [K-NODE-PORTABILITY]
      depends_on: []
      artifact: { path: packages/core/, type: package.json+tsconfig.json(著述)+tsconfig.tsbuildinfo(tsc の増分状態) }
      interface_contract:
        package: "@bomdd/core — main/types が dist/ を指す。tsconfig は rootDir=./src outDir=./dist"
      acceptance_refs: []
      notes: >-
        provenance= 著述(package.json / tsconfig.json)。所有範囲= packages/core/ のうち
        src/(4 ソース unit)と dist/(M-BUILD-CORE-010)を除いた残り。
        **既知の混載 1 件**: tsconfig.tsbuildinfo(鋳造物)が本 unit に同居する。
        前方一致写像+1 unit = 1 artifact.path の下では dist/ 外の鋳造物を著述物から分離できない
        (`packages/core/tsconfig` はパス区切りで一致しない)。分離には
        (a) ref-v0 に artifact.paths[] を入れる (b) 採点器に生成物パターンを入れる
        (c) tsbuildinfo を版管理から外す のいずれかが要る — 全て本 ECO のスコープ外(61 §5・§7)。
        混載を**契約文で明示**することで「人手編集禁止 unit が著述物を抱える」rev1 の矛盾は解消した。
    - id: M-PKGDEF-VIEWER-016
      name: viewer のパッケージ定義・ビルド構成
      ebom_refs: []
      kbom_refs: [K-NODE-PORTABILITY]
      depends_on: []
      artifact: { path: packages/viewer/, type: package.json+tsconfig.json(著述)+tsconfig.tsbuildinfo(tsc の増分状態) }
      interface_contract:
        package: "@bomdd/viewer — dependencies に @bomdd/core。tsconfig の references: [../core]"
      acceptance_refs: []
      notes: >-
        M-PKGDEF-CORE-015 と同型(既知の混載 1 件も同じ)。
        packages/cli/ は 1 package = 1 unit のため M-CLI-005 が package 全体(構成・src・dist)を
        所有しており、本系列の分離対象外(裁定 1 の 1 package = 1 unit 枝。V1 の 111 不変条件とも整合)。

  silence_sweep:   # 第2回掃討(全行3択。第1回の deferred-to-phase3 を解消)
